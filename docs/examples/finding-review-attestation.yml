# Inactive owner-reviewed example. Copy/review/merge/dispatch is a separate action.
# The producer runs only on this trusted ATLAS repository. It never executes Python.
name: Produce a historical ATLAS scan pair
on:
  workflow_dispatch:
    inputs:
      baseline_commit:
        description: Earlier full commit ID in mainline history (at most 200 commits/90 days)
        required: true
        type: string
permissions:
  contents: read
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 201
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Acquire a pinned scanner outside analysis
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-review-ruff" .atlas-tmp
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/astral-sh/ruff/releases/download/0.17.3/ruff-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/atlas-review-ruff/ruff.tar.gz"
          echo "2b0890f5a55900af741f133918c2656919bbf18c2ab7741b4ca8403a90e647a9  $RUNNER_TEMP/atlas-review-ruff/ruff.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/atlas-review-ruff/ruff.tar.gz" -C "$RUNNER_TEMP/atlas-review-ruff"
      - name: Produce two committed scan declarations in one history artifact
        env:
          ATLAS_BASELINE: ${{ inputs.baseline_commit }}
        run: node scripts/produce-finding-review.mjs --baseline "$ATLAS_BASELINE" --ruff "$RUNNER_TEMP/atlas-review-ruff/ruff-x86_64-unknown-linux-gnu/ruff" --out .atlas-tmp/finding-review-attestation
      - name: Sign both source-free scan subjects with the current producer revision
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            .atlas-tmp/finding-review-attestation/baseline.scan.json
            .atlas-tmp/finding-review-attestation/current.scan.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain the public signature beside the subjects
        env:
          ATLAS_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$ATLAS_BUNDLE_PATH" .atlas-tmp/finding-review-attestation/scans.sigstore.json
      - name: Publish only the explicitly reviewed source-free outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-historical-scans
          path: |
            .atlas-tmp/finding-review-attestation/artifact/
            .atlas-tmp/finding-review-attestation/baseline.scan.json
            .atlas-tmp/finding-review-attestation/current.scan.json
            .atlas-tmp/finding-review-attestation/finding-review.json
            .atlas-tmp/finding-review-attestation/scans.sigstore.json
          retention-days: 7
          if-no-files-found: error
# Artifact sharing exposes paths/metrics/relationships; owner reviews that disclosure.
# NEVER upload the output parent or private/: it contains source copies and raw SARIF.
# The initial finding-review.json remains unsigned/unverified. Consumers recreate it
# with independent historical-target/producer policies and the original scan subjects.
