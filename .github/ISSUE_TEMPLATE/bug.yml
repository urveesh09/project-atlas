name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste source code, tokens or private repository names; ATLAS artifacts never need them.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `atlas doctor`, the release version, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Analysis (CLI)", "Viewer: 3D city", "Viewer: map, table or inspector", "History and comparison", "Hosted service", "Install or packaging", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or clicks, and for a public repository its URL and commit.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser and GPU (for viewer issues), and whether low detail was on.
