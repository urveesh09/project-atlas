name: release

# A version tag builds a verified release candidate: the portable CLI archive with
# checksums and build provenance, and the API and sandbox images on GHCR. The GitHub
# release is created as a draft; a maintainer reviews and publishes it (ADR-044).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: CLI archive, checksums and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: The tag must match every package version
        id: version
        run: echo "version=$(node scripts/check-release-version.mjs "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: Full verification (typecheck, viewer build, dependency direction, contracts, tests)
        run: pnpm verify
        env:
          ATLAS_REQUIRE_BROWSER_TESTS: '1'
      - name: Package the portable CLI and test it outside the checkout
        run: pnpm verify:distribution
      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          archive=$(node -p "require('./.atlas-tmp/cli-distribution-result.json').archive")
          cp "$archive" "release/atlas-cli-${VERSION}.tar.gz"
          cp docs/release/distribution-smoke.md "release/distribution-smoke-${VERSION}.md"
          (cd release && sha256sum atlas-cli-*.tar.gz > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Attest build provenance of the archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/atlas-cli-*.tar.gz
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag $prerelease \
            --title "ATLAS $VERSION" --notes-file docs/release/release-notes.md

  images:
    name: API and sandbox images
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [api, sandbox]
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node scripts/check-release-version.mjs "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Attest build provenance of the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
