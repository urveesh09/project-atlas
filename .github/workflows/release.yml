name: release

# A version tag builds a verified release candidate: the portable CLI archive with
# checksums and build provenance, and the API and sandbox images on GHCR. The GitHub
# release is created as a draft; a maintainer reviews and publishes it (ADR-044).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    name: CLI archive, checksums and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: The tag must match every package version
        id: version
        run: |
          version=$(node scripts/check-release-version.mjs "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The same pinned interpreter as CI for the CPython oracle (ADR-068).
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: Full verification (typecheck, viewer build, dependency direction, contracts, tests)
        run: pnpm verify
        env:
          ATLAS_REQUIRE_BROWSER_TESTS: '1'
          ATLAS_ORACLE_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Package the portable CLI and test it outside the checkout
        run: pnpm verify:distribution
      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          archive=$(node -p "require('./.atlas-tmp/cli-distribution-result.json').archive")
          cp "$archive" "release/atlas-cli-${VERSION}.tar.gz"
          cp docs/release/distribution-smoke.md "release/distribution-smoke-${VERSION}.md"
          (cd release && sha256sum atlas-cli-*.tar.gz > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Attest build provenance of the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/atlas-cli-*.tar.gz
      - name: Verify the archive's signed workflow, tag and source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release/atlas-cli-*.tar.gz --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - name: Keep the verified CLI candidate until all image gates pass
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-cli
          retention-days: 1
          path: release/*

  image-candidates:
    name: Scan ${{ matrix.image }} release candidate
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        image: [api, sandbox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: version
        run: |
          version=$(node scripts/check-release-version.mjs "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: policy
        run: |
          node -e "const p=require('./deploy/image-policy.json'); for(const k of ['sbomGenerator','builder','buildxVersion']) console.log(k+'='+p[k])" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ steps.policy.outputs.buildxVersion }}
          driver-opts: image=${{ steps.policy.outputs.builder }}
      - name: Build once into an OCI archive; do not publish before scanning
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=max
          sbom: generator=${{ steps.policy.outputs.sbomGenerator }}
          tags: ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Verify the complete image and enforce the fixable high/critical gate
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/image-supply-chain.mjs check "$RUNNER_TEMP/image.tar" "$DIGEST" "$GITHUB_SHA" "$RUNNER_TEMP/reports"
      - name: Keep the verified archive for publication in this run only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-image-${{ matrix.image }}
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/reports/*.json
      - name: Keep scan evidence on success and failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-scan-${{ matrix.image }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/reports/*.json
            ${{ runner.temp }}/reports/*.log

  images:
    name: Publish verified ${{ matrix.image }} image
    # Both image scans must pass before either image is published.
    needs: image-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [api, sandbox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: version
        run: |
          version=$(node scripts/check-release-version.mjs "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-image-${{ matrix.image }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Copy exactly the scanned OCI graph and verify the registry digest
        id: push
        env:
          TARGET: ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.image }}:${{ steps.version.outputs.version }}
        run: |
          digest=$(node scripts/image-supply-chain.mjs publish image.tar reports/image.json "$TARGET" "$GITHUB_SHA")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify the signed identity, tag and commit before accepting publication
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.image }}@${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners

  draft:
    name: Create the fully verified release draft
    needs: [cli, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-cli
          path: release
      - name: Create a draft only after CLI and both signed image publications passed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.cli.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag $prerelease \
            --title "ATLAS $VERSION" --notes-file docs/release/release-notes.md
