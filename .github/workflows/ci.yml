name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-foundation:
    name: hosted PostgreSQL and offline isolation foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: atlas-ci-test
          POSTGRES_DB: atlas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the pinned offline probe image
        run: |
          docker pull node@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d
          taskImageId=$(docker image inspect node@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d --format '{{.Id}}')
          echo "ATLAS_TEST_SANDBOX_IMAGE=$taskImageId" >> "$GITHUB_ENV"
      - run: pnpm exec vitest run apps/api/test/hosted.test.ts apps/worker/test/queue.test.ts apps/worker/test/sandbox.test.ts
        env:
          ATLAS_TEST_DATABASE_URL: postgres://postgres:atlas-ci-test@127.0.0.1:5432/atlas_test
          ATLAS_REQUIRE_HOSTED_TESTS: '1'
          ATLAS_CONTAINER_TESTS: '1'

  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: git --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - run: pnpm verify
        env:
          ATLAS_REQUIRE_BROWSER_TESTS: '1'

  acquisition:
    name: live GitHub acquisition spike
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/ingest/test/github.test.ts
        env:
          ATLAS_NETWORK_TESTS: '1'

  render-spike:
    name: render spike (software GL, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - run: pnpm --filter @atlas/web build
      - run: node apps/web/scripts/render-spike.mjs --runs 5
      - uses: actions/upload-artifact@v4
        with:
          name: render-spike-report
          path: docs/benchmarks/phase0-render-spike.*
