name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: git --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - run: pnpm verify
        env:
          ATLAS_REQUIRE_BROWSER_TESTS: '1'

  acquisition:
    name: live GitHub acquisition spike
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/ingest/test/github.test.ts
        env:
          ATLAS_NETWORK_TESTS: '1'

  render-spike:
    name: render spike (software GL, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - run: pnpm --filter @atlas/web build
      - run: node apps/web/scripts/render-spike.mjs --runs 5
      - uses: actions/upload-artifact@v4
        with:
          name: render-spike-report
          path: docs/benchmarks/phase0-render-spike.*
