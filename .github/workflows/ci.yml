name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted:
    name: hosted service gates (PostgreSQL, S3, containers, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        # postgres:17-alpine (17.11), multi-arch index checked 2026-10-16; refresh monthly.
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: atlas-ci-test
          POSTGRES_DB: atlas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: Build packages and viewer (sandboxes run compiled entrypoints)
        run: pnpm build && pnpm build:web
      - name: Start the pinned S3-compatible gateway
        run: |
          docker run --detach --name atlas-s3 --publish 127.0.0.1:7070:7070 --tmpfs /data             --env ROOT_ACCESS_KEY=atlas --env ROOT_SECRET_KEY=atlas-test-secret             versity/versitygw@sha256:605de57c0cdc297fc5bc905ece592965d542d8df70d6eedf755734c80f2eb797 --quiet posix /data
      - name: Build the sandbox image and resolve the pinned offline probe image
        run: |
          docker build --file deploy/sandbox.Dockerfile --tag atlas-sandbox:ci .
          echo "ATLAS_TEST_RUNTIME_IMAGE=$(docker image inspect atlas-sandbox:ci --format '{{.Id}}')" >> "$GITHUB_ENV"
          docker pull node@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d
          echo "ATLAS_TEST_SANDBOX_IMAGE=$(docker image inspect node@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Validate and rehearse the production API profile and worker firewall
        run: |
          docker build --file deploy/api.Dockerfile --tag atlas-api:m41 .
          docker build --file deploy/production/proxy.Dockerfile --tag atlas-proxy:m41 .
          docker build --file deploy/production/validation.Dockerfile --tag atlas-validation:m41 .
          node scripts/hosted-rehearsal.mjs --production-profile \
            --api-image "$(docker image inspect atlas-api:m41 --format '{{.Id}}')" \
            --proxy-image "$(docker image inspect atlas-proxy:m41 --format '{{.Id}}')" \
            --validation-image "$(docker image inspect atlas-validation:m41 --format '{{.Id}}')" \
            --out .atlas-tmp/m41-production.json
      - name: Rehearse private PostgreSQL backups and isolated restore lifecycle
        run: |
          docker build --file deploy/production/backup-tools.Dockerfile --tag atlas-backup:m43 .
          node scripts/backup-rehearsal.mjs \
            --tools-image "$(docker image inspect atlas-backup:m43 --format '{{.Id}}')" \
            --out .atlas-tmp/m43-backup.json
      - run: pnpm exec vitest run apps/api/test apps/worker/test packages/control/test packages/ingest/test/egress.test.ts packages/ingest/test/missing-objects.test.ts
        env:
          ATLAS_TEST_DATABASE_URL: postgres://postgres:atlas-ci-test@127.0.0.1:5432/atlas_test
          ATLAS_TEST_S3_ENDPOINT: http://127.0.0.1:7070
          ATLAS_REQUIRE_HOSTED_TESTS: '1'
          ATLAS_REQUIRE_BROWSER_TESTS: '1'
          ATLAS_A11Y_REPORT_DIR: .atlas-tmp/accessibility
          ATLAS_CONTAINER_TESTS: '1'
          ATLAS_NETWORK_TESTS: '1'
      - name: No sandbox container or network may remain
        if: always()
        run: |
          test -z "$(docker ps --all --filter label=atlas.sandbox --format '{{.Names}}')"
          test -z "$(docker network ls --filter label=atlas.sandbox=network --format '{{.Name}}')"

      - name: Keep named accessibility audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-hosted
          retention-days: 7
          include-hidden-files: true
          path: .atlas-tmp/accessibility/*.jsonl
      - name: Keep the production rehearsal report (never its generated secrets)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-rehearsal
          retention-days: 7
          path: .atlas-tmp/m41-production.json
      - name: Keep only the sanitized backup drill report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-restore-rehearsal
          retention-days: 7
          path: .atlas-tmp/m43-backup.json

  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: git --version
      # The CPython oracle compares the Python parser with this exact interpreter on every
      # OS. Runners' default Pythons differ (3.12 on Ubuntu and Windows, 3.15 on macOS) (ADR-068).
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - run: pnpm verify
        env:
          ATLAS_REQUIRE_BROWSER_TESTS: '1'
          ATLAS_A11Y_REPORT_DIR: .atlas-tmp/accessibility
          ATLAS_ORACLE_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Extract and verify the CLI candidate outside the checkout
        run: pnpm verify:distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-distribution-${{ matrix.os }}
          retention-days: 7
          include-hidden-files: true
          path: |
            docs/release/distribution-smoke.*
            .atlas-tmp/cli-distribution-result.json
            .atlas-tmp/releases/*/atlas-cli-candidate.tar.gz

      - name: Keep named accessibility audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-${{ matrix.os }}
          retention-days: 7
          include-hidden-files: true
          path: .atlas-tmp/accessibility/*.jsonl

  browsers:
    # Every viewer journey in Firefox and WebKit too; verify runs them in Chromium (ADR-069).
    name: viewer journeys (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: A virtual display and Mesa's software OpenGL for Firefox
        if: matrix.browser == 'firefox'
        run: sudo apt-get install --yes --no-install-recommends xvfb libgl1-mesa-dri libegl1
      - run: pnpm build && pnpm build:web
      # Firefox reaches Mesa's software OpenGL only through a display, so it runs headed in
      # Xvfb; WebKit runs headless (ADR-069).
      - run: ${{ matrix.browser == 'firefox' && 'xvfb-run --auto-servernum' || '' }} pnpm exec vitest run packages/cli/test/viewer.e2e.test.ts
        env:
          ATLAS_REQUIRE_BROWSER_TESTS: '1'
          ATLAS_A11Y_REPORT_DIR: .atlas-tmp/accessibility
          ATLAS_E2E_BROWSER: ${{ matrix.browser }}
          ATLAS_E2E_HEADED: ${{ matrix.browser == 'firefox' && '1' || '0' }}

      - name: Keep named accessibility audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-${{ matrix.browser }}
          retention-days: 7
          include-hidden-files: true
          path: .atlas-tmp/accessibility/*.jsonl

  corpus:
    name: pinned repository corpus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Acquire only the six immutable public corpus commits
        run: node scripts/validate-real-repositories.mjs --acquire
      - name: Five offline cold runs and independent source checks
        run: node scripts/validate-real-repositories.mjs
      - name: Preserve the committed canonical and wire corpus bytes
        run: node scripts/check-repository-baseline.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-corpus-${{ matrix.os }}
          retention-days: 7
          path: docs/release/real-repositories.*

  corpus-determinism:
    name: pinned corpus Windows/Linux determinism
    needs: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repository-corpus-*
          path: .atlas-tmp/corpus-reports
      # The job keeps its name because branch protection requires it; it now compares all
      # three operating systems (ADR-068).
      - run: >-
          node scripts/compare-repository-reports.mjs
          .atlas-tmp/corpus-reports/repository-corpus-ubuntu-latest/real-repositories.json
          .atlas-tmp/corpus-reports/repository-corpus-windows-latest/real-repositories.json
          .atlas-tmp/corpus-reports/repository-corpus-macos-latest/real-repositories.json

  acquisition:
    name: live GitHub acquisition spike
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/ingest/test/github.test.ts
        env:
          ATLAS_NETWORK_TESTS: '1'

  render-spike:
    name: render spike (software GL, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - run: pnpm --filter @atlas/web build
      - run: node apps/web/scripts/render-spike.mjs --runs 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-spike-report
          path: docs/benchmarks/phase0-render-spike.*
