name: demo site

# Publishes the static demo (ADR-044): the viewer opening a verified, source-free analysis of
# a pinned public repository from the corpus (vuejs/core, MIT). Runs on demand and when a
# release is published; GitHub Pages must use "GitHub Actions" as its source. Dispatched
# from any other branch, it builds and checks the site without deploying it.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Acquire only the immutable pinned corpus commits
        run: node scripts/validate-real-repositories.mjs --acquire
      - name: Analyze offline and require the committed baseline bytes
        run: node scripts/validate-real-repositories.mjs && node scripts/check-repository-baseline.mjs
      - name: Build the static site around the verified vuejs/core artifact
        run: node scripts/build-demo-site.mjs --artifact .atlas-tmp/release-corpus/vuejs-core/artifact --out "$RUNNER_TEMP/site" --site-url "$SITE_URL"
        env:
          # The Pages address of this repository; link previews need absolute URLs (ADR-058).
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: Open the built site in Chromium before publishing it
        run: node scripts/check-demo-site.mjs "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
