# Dependency updates are proposals, never automatic merges. The toolchain and libraries are
# pinned on purpose (docs/toolchain.md): each pull request must pass CI and be reviewed,
# and a change of output bytes needs the corpus baseline and an ADR (AGENTS.md).
#
# npm packages get no routine version updates: Dependabot's npm job failed inside pnpm on
# this pinned workspace (run of 2026-10-12, error processing @types/node), and the pins are
# deliberate anyway. Vulnerable npm packages are still covered by Dependabot security alerts
# and security updates, enabled in the repository's security settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    commit-message:
      prefix: deploy
